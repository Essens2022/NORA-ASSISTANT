name: Deploy web app (GitHub Pages)
# Pages serves the gh-pages branch; this workflow rebuilds it on every change to the app.
on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'packages/core/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        # project site lives under /<repo>/; public Supabase values come from apps/web/.env.production
        run: BASE_PATH="/${{ github.event.repository.name }}/" npm -w apps/web run build
      - name: Publish to gh-pages
        working-directory: apps/web/dist
        run: |
          cp index.html 404.html   # SPA fallback for deep links
          touch .nojekyll
          find . -name '*.map' -delete
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
