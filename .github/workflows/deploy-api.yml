name: Deploy Edge Functions (Supabase)
# Deploys the api and dispatch functions straight from this repo on every change to them.
on:
  push:
    branches: [main]
    paths: ['packages/core/**', 'supabase/functions/**', 'supabase/config.toml', '.github/workflows/deploy-api.yml']
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync packages/core into the Edge Function's copy
        run: npm run sync-core
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy api
        run: supabase functions deploy api --project-ref pkosophevtnapaazghks
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy dispatch
        run: supabase functions deploy dispatch --project-ref pkosophevtnapaazghks
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
