name: Build Android (Capacitor)
# Wraps the live PWA (norakeep.com) in a Capacitor WebView shell for Google Play.
# Unlike the old TWA/bubblewrap build, apps/web/android is a real, committed
# native Gradle project - no scaffolding step, no interactive-prompt issues.
on:
  push:
    branches: [main]
    paths: ['apps/web/android/**', 'apps/web/capacitor.config.ts', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v4, not v3: v3's default package list still includes the discontinued
      # "tools" package, which fails outright on today's SDK repository.
      - uses: android-actions/setup-android@v4

      - name: Install extra SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Restore the signing keystore from secrets
        working-directory: apps/web/android
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Build & sign the release APK and AAB
        working-directory: apps/web/android
        env:
          ANDROID_KEYSTORE_PATH: ../android.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: nora-android
          path: |
            apps/web/android/app/build/outputs/apk/release/app-release.apk
            apps/web/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
